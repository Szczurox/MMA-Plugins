# Vendored copy of om-file-format-sys from https://github.com/open-meteo/om-file-format
# (rust/om-file-format-sys, rev d8855e418e2231ae8439f0c7e840fa3f93b371e3), GPL-2.0-only.
#
# Changes from upstream, see ../README.md:
#   * the C sources are real files in c/ (upstream reaches them through a git symlink that Windows
#     checks out as a text file);
#   * the Rust bindings are committed (src/bindings.rs), so building needs a C compiler but not
#     bindgen or libclang. `bindgen` is only built with the `regenerate-bindings` feature.
[package]
name = "om-file-format-sys"
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-only"
authors = ["Terraputix <terraputix@mailbox.org>"]
readme = "README.md"
categories = ["compression", "encoding"]
keywords = ["meteo", "weather", "file-format", "bindings"]
description = "Rust bindings for om-file-format C code"
repository = "https://github.com/open-meteo/om-file-format"

build = "build.rs"
include = [
    "c/include/**/*.h",
    "c/src/**/*.c",
    "src/**/*",
    "Cargo.toml",
    "build.rs",
    "README.md",
]

[features]
# Rewrites src/bindings.rs from the C headers (needs libclang).
regenerate-bindings = ["dep:bindgen"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
bindgen = { version = "0.72", optional = true }
