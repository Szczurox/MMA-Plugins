# Builds every plugin's sidecar on Windows, Linux and macOS, packages one zip per platform and
# creates the GitHub releases: one per plugin whose version is new, plus the rolling "bundle".
#
# A plugin is released when no tag <id>-v<version> exists yet. The workflow runs when a push to main
# changes a plugin's manifest.json (where `version` lives), so bumping a version and pushing is the
# whole release; pushes that bump nothing stop after the plan job. It can also be started by hand
# (`just publish`, or "Run workflow" on GitHub), which is how to retry a failed run or to try the
# builds with "Build and test only", which publishes nothing.
name: Release

on:
  push:
    branches: [main]
    paths:
      - plugins/*/manifest.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only; do not publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags decide which versions are new
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: node scripts/release-plan.mjs --ci --github-output

  sidecars:
    needs: plan
    if: needs.plan.outputs.any == 'true' || inputs.dry_run
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each platform builds on its own runner with plain cargo (see scripts/sidecar.mjs).
          # ubuntu-22.04 keeps the Linux binary's glibc requirement low.
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: macos-arm64
            os: macos-15 # Apple silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust toolchain
        run: rustup update stable
      # The sidecar's C code does not build with MSVC, so Windows uses the GNU target and MinGW gcc.
      - name: MinGW gcc and the GNU target
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-gcc
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: node scripts/sidecar.mjs test
      - run: node scripts/sidecar.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.platform }}
          path: dist/sidecars/${{ matrix.platform }}
          if-no-files-found: error

  package:
    needs: [plan, sidecars]
    runs-on: ubuntu-latest
    env:
      MMA_SIDECAR_DIR: ${{ github.workspace }}/dist/sidecars
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-windows-x64
          path: dist/sidecars/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-linux-x64
          path: dist/sidecars/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: sidecar-macos-arm64
          path: dist/sidecars/macos-arm64
      - name: Plugin tests
        # The sidecars' Rust tests already ran on every platform in the sidecars job.
        run: node scripts/plugins.mjs test --no-sidecar
      - name: Package every platform
        run: |
          for platform in windows-x64 linux-x64 macos-arm64; do
            node scripts/plugins.mjs release --platform "$platform"
            node scripts/package.mjs --platform "$platform"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [plan, package]
    if: ${{ !inputs.dry_run && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: dist
      - run: node scripts/release-upload.mjs
        env:
          GH_TOKEN: ${{ github.token }}
